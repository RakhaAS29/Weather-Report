<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Weatherline</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css" />
</head>
<body data-weather="default" data-time="day" data-layout="landing">

  <div class="sky" aria-hidden="true">
    <div class="sky__body"></div>
  </div>

  <main class="app">

    <header class="app__header">
      <p class="wordmark">Weatherline</p>
      <form class="search" id="search-form" autocomplete="off">
        <input
          type="text"
          id="search-input"
          class="search__input"
          placeholder="Search a city…"
          aria-label="Search a city"
          required
        />
        <button type="submit" class="search__button" aria-label="Search">
          <svg width="18" height="18" viewBox="0 0 18 18" fill="none" xmlns="http://www.w3.org/2000/svg">
            <circle cx="8" cy="8" r="6.25" stroke="currentColor" stroke-width="1.5"/>
            <path d="M12.5 12.5L16 16" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
          </svg>
        </button>
        <button type="button" class="search__geo" id="geo-button" aria-label="Use my location" title="Use my location">
          <svg width="18" height="18" viewBox="0 0 18 18" fill="none" xmlns="http://www.w3.org/2000/svg">
            <circle cx="9" cy="9" r="2" fill="currentColor"/>
            <path d="M9 1V3.5M9 14.5V17M17 9H14.5M3.5 9H1" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
          </svg>
        </button>
      </form>
    </header>

    <!-- Loading state -->
    <section class="state state--loading" id="loading-state" hidden>
      <p class="state__text">Reading the sky…</p>
    </section>

    <!-- Error state -->
    <section class="state state--error" id="error-state" hidden>
      <p class="state__text" id="error-text">Couldn't find that place. Try another city.</p>
    </section>

    <!-- Empty / first-load state -->
    <section class="state state--empty" id="empty-state">
      <p class="state__text">Search a city to get its current conditions and a five‑day outlook.</p>
    </section>

    <!-- Weather card: appears once a search returns results -->
    <section class="weather-card" id="weather-card" hidden>

      <!-- Current conditions -->
      <div class="current">
        <div class="current__primary">
          <p class="current__place" id="current-place">—</p>
          <p class="current__temp"><span id="current-temp">0</span>&deg;<span id="current-unit">C</span></p>
          <p class="current__condition" id="current-condition">—</p>
        </div>

        <dl class="readout">
          <div class="readout__item">
            <dt>Feels like</dt>
            <dd><span id="current-feels">0</span>&deg;</dd>
          </div>
          <div class="readout__item">
            <dt>Humidity</dt>
            <dd><span id="current-humidity">0</span>%</dd>
          </div>
          <div class="readout__item">
            <dt>Wind</dt>
            <dd><span id="current-wind">0</span> m/s</dd>
          </div>
          <div class="readout__item">
            <dt>Sunrise</dt>
            <dd id="current-sunrise">—</dd>
          </div>
          <div class="readout__item">
            <dt>Sunset</dt>
            <dd id="current-sunset">—</dd>
          </div>
        </dl>
      </div>

      <!-- Forecast strip -->
      <div class="forecast">
        <p class="forecast__label">Five-day outlook</p>
        <div class="forecast__strip" id="forecast-strip"></div>
      </div>

    </section>

    <footer class="app__footer">
      <p>Data from OpenWeatherMap</p>
    </footer>

  </main>

  <script src="script.js"></script>
</body>
</html>
